# Builds the mod on pushes and pull requests, and publishes the jar:
# - every push (including merges) to main updates the rolling "Development build" pre-release
# - pushing a version tag such as v1.2.0 publishes a normal release for that version, and also uploads
#   the jar to CurseForge when the CURSEFORGE_TOKEN secret is set
# Every run also starts a server with the mod to catch crashes while loading, and keeps its jar
# as a downloadable artifact on the run's page.

name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    # Forge 1.12.2 builds and runs on Java 8.
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    # A version tag such as v1.2.0 sets the mod version; other builds use the one in gradle.properties.
    - name: Build with Gradle Wrapper
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}"
        else
          ./gradlew build
        fi

    # Starts a dedicated server with the mod and a fresh world, and fails on a crash or a mod
    # loading error.
    - name: Check the mod loads on a server
      run: ./scripts/check-server-starts.sh

    - name: Upload the server log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: build/server-check.log
        if-no-files-found: ignore

    # Keep only the jar players install (not the -dev, -sources or -api jars).
    - name: Collect the mod jar
      run: |
        mkdir -p dist
        find build/libs -maxdepth 1 -name '*.jar' \
          ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-api.jar' \
          -exec cp {} dist/ \;
        ls -l dist

    - name: Upload the mod jar
      uses: actions/upload-artifact@v4
      with:
        name: MoreDyes
        path: dist/*.jar
        if-no-files-found: error

  publish:
    needs: build
    # Pushes and merges to main, and version tags. Never pull requests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Two quick pushes to main must not replace the development build at the same time.
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # An upload token from CurseForge (account settings > API Tokens), stored as a repository secret.
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    steps:
    - name: Download the mod jar
      uses: actions/download-artifact@v4
      with:
        name: MoreDyes
        path: dist

    - name: Update the development build
      if: github.ref == 'refs/heads/main'
      run: |
        # Replace the previous development build, so the release always holds the newest jar.
        gh release delete dev-build --yes --cleanup-tag || true
        gh release create dev-build dist/*.jar \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Development build" \
          --notes "Latest build of main, from commit $GITHUB_SHA. Untested; for testing only."

    - name: Publish the release for this version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          # The release was already made on GitHub (for example with "Draft a new release"), so add the jar to it.
          gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "More Dyes $GITHUB_REF_NAME" \
            --generate-notes
        fi

    # Uploads the release jar to https://www.curseforge.com/minecraft/mc-mods/moredyes (project 252137).
    # Development builds stay on GitHub only.
    - name: Upload the release to CurseForge
      if: startsWith(github.ref, 'refs/tags/v') && env.CURSEFORGE_TOKEN != ''
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        curseforge-id: 252137
        curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
        files: dist/*.jar
        name: More Dyes ${{ github.ref_name }} for Minecraft 1.12.2
        version: ${{ github.ref_name }}
        version-type: release
        changelog: See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        loaders: forge
        game-versions: 1.12.2
        java: 8

    - name: Note the skipped CurseForge upload
      if: startsWith(github.ref, 'refs/tags/v') && env.CURSEFORGE_TOKEN == ''
      run: echo "::warning::CURSEFORGE_TOKEN is not set, so this release was not uploaded to CurseForge."
