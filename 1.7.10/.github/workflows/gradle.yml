# Builds the mod on every push and pull request, and publishes the jar:
# - every push (including merges) to main updates the rolling "Development build" pre-release
# - pushing a version tag such as v1.2.0 publishes a normal release for that version
# Every run also starts a server with the mod to catch crashes while loading, and keeps its jar
# as a downloadable artifact on the run's page.

name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        # The version number comes from the git tags.
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    # The mod version is the version tag being built, or for other builds the last version tag plus
    # the commits since. Set here because the rolling dev-build tag would otherwise be picked up.
    - name: Work out the mod version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version=$(git describe --tags --match 'v*' 2>/dev/null | sed 's/^v//')
        fi
        echo "VERSION=${version:-dev}" >> "$GITHUB_ENV"

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # Starts a dedicated server with the release jar and a fresh world, and fails on a crash or a
    # mod loading error (for example a block or item registered wrongly).
    - name: Check the mod loads on a server
      run: ./scripts/check-server-starts.sh

    - name: Upload the server log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: build/server-check.log
        if-no-files-found: ignore

    # Keep only the jar players install (not the -dev, -sources or -api jars).
    - name: Collect the mod jar
      run: |
        mkdir -p dist
        find build/libs -maxdepth 1 -name '*.jar' \
          ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-api.jar' \
          -exec cp {} dist/ \;
        ls -l dist

    - name: Upload the mod jar
      uses: actions/upload-artifact@v4
      with:
        name: MoreDyes
        path: dist/*.jar
        if-no-files-found: error

  publish:
    needs: build
    # Pushes and merges to main, and version tags. Never pull requests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Two quick pushes to main must not replace the development build at the same time.
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
    - name: Download the mod jar
      uses: actions/download-artifact@v4
      with:
        name: MoreDyes
        path: dist

    - name: Update the development build
      if: github.ref == 'refs/heads/main'
      run: |
        # Replace the previous development build, so the release always holds the newest jar.
        gh release delete dev-build --yes --cleanup-tag || true
        gh release create dev-build dist/*.jar \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Development build" \
          --notes "Latest build of main, from commit $GITHUB_SHA. Untested; for testing only."

    - name: Publish the release for this version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          # The release was already made on GitHub (for example with "Draft a new release"), so add the jar to it.
          gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "More Dyes $GITHUB_REF_NAME" \
            --generate-notes
        fi

  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
