# Builds the mod on pushes and pull requests, and publishes the jar:
# - every push (including merges) to master updates the rolling "Development build" pre-release
# - pushing a version tag such as v1.2.0 publishes a normal release for that version
# Every run also starts a server with the mod to catch crashes and data errors while loading, and
# keeps its jar as a downloadable artifact on the run's page.

name: Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    # Forge 1.16.5 builds and runs on Java 8.
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # Starts a dedicated server with the mod and a fresh world, and fails on a crash, a mod loading
    # error, or a recipe, tag or loot table that does not load.
    - name: Check the mod loads on a server
      run: ./scripts/check-server-starts.sh

    - name: Upload the server log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: build/server-check.log
        if-no-files-found: ignore

    # Keep only the jar players install (not the -dev, -sources or -api jars).
    - name: Collect the mod jar
      run: |
        mkdir -p dist
        find build/libs -maxdepth 1 -name '*.jar' \
          ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-api.jar' \
          -exec cp {} dist/ \;
        ls -l dist

    - name: Upload the mod jar
      uses: actions/upload-artifact@v4
      with:
        name: MoreDyes
        path: dist/*.jar
        if-no-files-found: error

  publish:
    needs: build
    # Pushes and merges to master, and version tags. Never pull requests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Two quick pushes to master must not replace the development build at the same time.
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
    - name: Download the mod jar
      uses: actions/download-artifact@v4
      with:
        name: MoreDyes
        path: dist

    - name: Update the development build
      if: github.ref == 'refs/heads/master'
      run: |
        # Replace the previous development build, so the release always holds the newest jar.
        gh release delete dev-build --yes --cleanup-tag || true
        gh release create dev-build dist/*.jar \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Development build" \
          --notes "Latest build of master, from commit $GITHUB_SHA. Untested; for testing only."

    - name: Publish the release for this version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        gh release create "$GITHUB_REF_NAME" dist/*.jar \
          --title "More Dyes $GITHUB_REF_NAME" \
          --generate-notes
